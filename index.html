<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neverwake</title>
  <meta name="description" content="Neverwake: Stable Long-Horizon Rollouts for Diffusion World Models">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #f2f2f2;
        --muted: #999999;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    p.subtitle {
      margin-top: 12px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted);
      max-width: 36em;
    }
    p.soon {
      margin-top: 40px;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Neverwake</h1>
    <p class="subtitle">Stable Long-Horizon Rollouts for Diffusion World Models</p>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
